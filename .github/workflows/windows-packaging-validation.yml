name: Windows packaging validation

on:
  pull_request:
    branches: [main]
    paths:
      - "electron/**"
      - "prisma/**"
      - "src/lib/logging/**"
      - "src/lib/backup.ts"
      - "src/instrumentation.ts"
      - "electron-builder.yml"
      - "prisma.config.ts"
      - "package.json"
      - "package-lock.json"
      - "launch/**"
      - "scripts/**"
      - "scripts-*.cjs"
      - ".github/workflows/windows-packaging-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate launcher PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          [void][scriptblock]::Create((Get-Content -Raw "launch/ServerProcess.ps1"))
          Write-Host "Launcher PowerShell syntax is valid."

      - name: Install project dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Prepare clean SQLite database
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path data | Out-Null
          npx prisma migrate deploy
          if ($LASTEXITCODE -ne 0) { throw "Clean database migration failed." }

      - name: Validate upgrade from the previous migration state
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $auditMigration = "prisma/migrations/20261015140000_add_audit_logging"
          $heldMigration = "prisma/20261015140000_add_audit_logging.validation-hold"
          $upgradeDb = Join-Path $PWD "data/upgrade-test.db"
          if (Test-Path $upgradeDb) { Remove-Item $upgradeDb -Force }
          if (-not (Test-Path $auditMigration)) { throw "Audit migration directory was not found." }
          try {
            Move-Item -Path $auditMigration -Destination $heldMigration
            $env:DATABASE_URL = "file:" + ($upgradeDb -replace "\\", "/")
            npx prisma migrate deploy
            if ($LASTEXITCODE -ne 0) { throw "Previous migration state failed to deploy." }
          }
          finally {
            if (Test-Path $heldMigration) {
              Move-Item -Path $heldMigration -Destination $auditMigration
            }
          }
          npx prisma migrate deploy
          if ($LASTEXITCODE -ne 0) { throw "Audit migration failed when upgrading an existing migrated database." }
          Remove-Item Env:DATABASE_URL -ErrorAction SilentlyContinue

      - name: Run tests and static validation
        run: |
          npm test
          npm run lint
          npm run typecheck
          npm run build

      - name: Install Windows packaging tools
        run: npm install --no-save --package-lock=false electron@37.2.6 electron-builder@26.0.12

      - name: Build Windows x64 installer
        run: npx electron-builder --win nsis --x64 --publish never --config electron-builder.yml

      - name: Verify Prisma migration tooling is packaged
        shell: pwsh
        run: |
          $prismaCli = Join-Path $PWD "release/win-unpacked/resources/app/node_modules/prisma/build/index.js"
          $prismaConfig = Join-Path $PWD "release/win-unpacked/resources/app/prisma.config.ts"
          if (-not (Test-Path $prismaCli)) { throw "Prisma CLI is missing from the packaged Electron application." }
          if (-not (Test-Path $prismaConfig)) { throw "Prisma config is missing from the packaged Electron application." }
          Write-Host "Packaged Prisma CLI and config are present."

      - name: Upload installer for inspection
        uses: actions/upload-artifact@v4
        with:
          name: cafe-panel-windows-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 7
