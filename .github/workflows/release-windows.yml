name: Build and publish Cafe Panel for Windows

on:
  push:
    branches:
      - release/v1.0.0
      - release/v0.1.0

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Prepare a clean database
        run: mkdir -p data && npx prisma migrate deploy

      - name: Run automated tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build production application
        run: npm run build

  windows-installer:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Prepare a clean database for first launch
        run: |
          New-Item -ItemType Directory -Force -Path data | Out-Null
          npx prisma migrate deploy

      - name: Build production application
        run: npm run build

      - name: Install Windows desktop packaging tools
        run: npm install --no-save --package-lock=false electron@37.2.6 electron-builder@26.0.12

      - name: Build Windows x64 installer
        run: npx electron-builder --win nsis --x64 --publish never --config electron-builder.yml

      - name: Publish Windows release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name == 'release/v0.1.0' && 'v0.1.0' || 'v1.0.0' }}
          target_commitish: ${{ github.ref_name }}
          name: ${{ github.ref_name == 'release/v0.1.0' && 'Cafe Panel نسخه 0.1' || 'Cafe Panel v1.0.0' }}
          body: |
            Cafe Panel for Windows x64.

            - Windows installer (.exe)
            - Desktop application with bundled local web runtime
            - SQLite database and backups stored in the user's application data folder
            - First launch opens the setup screen to create the administrator password

            This is an early testing release. Back up existing application data before testing.
          files: release/Cafe-Panel-Setup-${{ github.ref_name == 'release/v0.1.0' && '0.1.0' || '1.0.0' }}.exe
          draft: false
          prerelease: ${{ github.ref_name == 'release/v0.1.0' }}
