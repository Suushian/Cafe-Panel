name: Build and publish Cafe Panel v0.1 for Windows

on:
  push:
    branches:
      - release/v0.1.0

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Prepare a clean database
        run: mkdir -p data && npx prisma migrate deploy

      - name: Run automated tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build production application
        run: npm run build

  windows-installer:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Prepare a clean database for first launch
        run: |
          New-Item -ItemType Directory -Force -Path data | Out-Null
          npx prisma migrate deploy

      - name: Build production application
        run: npm run build

      - name: Install Windows desktop packaging tools
        run: npm install --no-save --package-lock=false electron@37.2.6 electron-builder@26.0.12

      - name: Build Windows x64 installer
        run: npx electron-builder --win nsis --x64 --publish never --config electron-builder.yml

      - name: Publish version 0.1 test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          target_commitish: release/v0.1.0
          name: Cafe Panel نسخه 0.1
          body: |
            ## Cafe Panel نسخه 0.1 — Windows x64

            نسخه آزمایشی برای تست برنامه. قبل از استفاده با داده‌های واقعی، دیتابیس و نسخه‌های پشتیبان را جداگانه ذخیره کنید.

            - نصب‌کننده Windows x64 (.exe)
            - اجرای دسکتاپ با runtime محلی
            - دیتابیس و پشتیبان‌ها در پوشه داده کاربر ذخیره می‌شوند
            - در اجرای اول، صفحه ساخت رمز مدیر نمایش داده می‌شود
          files: release/Cafe-Panel-Setup-0.1.0.exe
          draft: false
          prerelease: true
